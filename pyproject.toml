[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "socialize"
version = "0.2.0"
description = "A pluggable ActivityPub server for Django projects."
authors = [
    { name = "William Oliveira de Lagos", email = "william.lagos@icloud.com" }
]
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "django>=3.2",
    "requests>=2.0",
    "cryptography>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.0",
]

[project.urls]
Homepage = "https://github.com/williamlagos/django-socialize"

[tool.ruff]
line-length = 88
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.ruff.format]
quote-style = "single"
